name: vm-finance

services:
  db:
    image: postgres:17-alpine
    container_name: vm-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vmfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vmfinance}
      POSTGRES_DB: ${POSTGRES_DB:-vmfinance}
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - vmfinance-pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ = variable del contenedor (no la sustituye compose).
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vmfinance-pgdata:
