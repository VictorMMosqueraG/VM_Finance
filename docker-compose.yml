# Postgres local para desarrollo (en producción se usa Neon).
# Uso: npm run db:up
services:
  db:
    image: postgres:17-alpine
    container_name: vm-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vmfinance
      POSTGRES_PASSWORD: vmfinance
      POSTGRES_DB: vmfinance
      TZ: America/Bogota
    ports:
      - '5432:5432'
    volumes:
      - vmfinance-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vmfinance -d vmfinance']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vmfinance-pgdata:
